# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# Legacy LWJGL2 compatibility is not part of the FloatingPod baseline.
enable_lwjglx = false

# Scala 3 / Scalar Probe
scala_version = 3.8.4
scalar_distribution_version = 3.8.4-1
scalar_fml_mod_version = 3.8.4

# Stage 1-B Probe 2: GeckoLib / CraftTweaker / ZenUtils 编译期依赖解析验证
# GeckoLib 官方 API 版本；编译期依赖指向该官方版本，与测试实例安装的定制 Foundation 构建（执行期）是刻意的不对称，见 Memory/claude/FP-probe-2.md
geckolib_version = 3.0.31
# CraftTweaker2 的人类可读版本号；实际 Curse Maven 坐标以下方的项目 slug 与文件 ID 解析
crafttweaker_version = 4.1.20.715
crafttweaker_curseforge_project_slug = crafttweaker-239197
crafttweaker_curseforge_file_id = 8051578
# ZenUtils 的人类可读版本号；实际 Curse Maven 坐标以下方的项目 slug 与文件 ID 解析
zenutils_version = 1.25.8
zenutils_curseforge_project_slug = zenutil-401178
zenutils_curseforge_file_id = 6976141
# Lumenized 的人类可读版本号；实际 Curse Maven 坐标以下方的项目 slug 与文件 ID 解析。
# 只用于编译期解析辉光注册入口签名（gregtech.client.utils.BloomEffectUtil 等），不进入产物，见 Memory/claude/FP-lumenized-dep.md
lumenized_version = 1.0.3
lumenized_curseforge_project_slug = lumenized-1234162
lumenized_curseforge_file_id = 6734060
# 用户指定 NeoContinuity Vintage 0.1.0 替代 CTM；mcmod.info: continuity / CleanContinuity。
neo_continuity_vintage_release_version = 0.1.0
neo_continuity_vintage_release_sha256 = DB11EF06492FB51018963C08C005F3D8470EE23D78C1C134F63FD5AD0E8207CC
codechickenlib_release_version = 3.2.4.1
codechickenlib_release_sha256 = 81ED77A4D45DA15FE5C489AE0C98FE7857181CAB647A03B5F115D99BFE167B79

# Mod Information
mod_version = 0.1.0-SNAPSHOT
root_package = com.wi.floatingpod
mod_id = floatingpod
mod_name = FloatingPod

# Mod Metadata (Optional)
mod_description =
mod_url =
mod_update_json =
mod_authors =
mod_credits =
mod_logo_path =

# Run Configurations
minecraft_username = Developer
extra_jvm_args = -Dmixin.hotSwap=true -Dmixin.debug.export=true -Dmixin.debug.verbose=true
enable_foundation_debug = false

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
# Good for debugging artifacts before uploading to remote maven
# GitHub actions won't run if this is true, test this by running the task `publishToMavenLocal`
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Access Transformers
use_access_transformer = false

# Coremods
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
